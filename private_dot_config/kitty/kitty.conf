# Theme
include current-theme.conf


# Font
font_family      FiraCode Nerd Font Ret
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        10.0
modify_font      cell_height 130%

# Window
window_padding_width  2
hide_window_decorations titlebar-only
confirm_os_window_close 0
background_opacity 1

# Terminal
term xterm-256color
shell_integration enabled

# Clipboard — use kitty defaults (Ctrl+Shift+C / Ctrl+Shift+V)
# Do NOT remap Ctrl+C — it breaks terminal interrupt
map ctrl+c copy_and_clear_or_interrupt 
map ctrl+v paste_from_clipboard

# Config reload
map ctrl+shift+f5 load_config_file

# Scrollback
scrollback_lines 10000
map ctrl+shift+k scroll_line_up
map ctrl+shift+j scroll_line_down
map ctrl+shift+u scroll_page_up
map ctrl+shift+d scroll_page_down

# Tab management
map ctrl+shift+t new_tab
map ctrl+shift+w close_tab
map ctrl+shift+right next_tab
map ctrl+shift+left previous_tab
map ctrl+shift+. set_tab_title

# Window (split) management
map ctrl+shift+enter new_window
map ctrl+shift+] next_window
map ctrl+shift+[ previous_window

# Font size
map ctrl+shift+equal change_font_size all +1.0
map ctrl+shift+minus change_font_size all -1.0
map ctrl+shift+0 change_font_size all 0

# Cursor
cursor_shape beam
cursor_blink_interval 0

# Bell
enable_audio_bell no
visual_bell_duration 0

# URL handling — click to open
url_style curly
open_url_with default
detect_urls yes

# Open scrollback in Neovim
scrollback_pager nvim -c "set nomodified nomodifiable noswapfile nonumber norelativenumber signcolumn=no" -c "silent! %s/\\e\\[[0-9;]*m//g" -c "gg" -
map ctrl+shift+h show_scrollback
